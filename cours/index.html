<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Sidebar avec auto-hide -->
    <div class="sidebar">
      <button class="sidebar-btn" data-tab="home">
        <span class="tab-text">Accueil</span>
        <span class="icon">🏠</span>
      </button>
      <button class="sidebar-btn" data-tab="dashboard">
        <span class="tab-text">Dashboard</span>
        <span class="icon">📊</span>
      </button>
      <button class="sidebar-btn" data-tab="settings">
        <span class="tab-text">Paramètres</span>
        <span class="icon">⚙️</span>
      </button>
      <button class="sidebar-btn" data-tab="messages">
        <span class="tab-text">Messages</span>
        <span class="icon">💬</span>
      </button>
      <button class="sidebar-btn" data-tab="notifications">
        <span class="tab-text">Notifications</span>
        <span class="icon">🔔</span>
      </button>
      <button class="sidebar-btn" data-tab="profile">
        <span class="tab-text">Profil</span>
        <span class="icon">👤</span>
      </button>
    </div>

    <div class="click-event box">
      <h4>quelle est la capitale de la France ?</h4>
      <button id="btn-1">Paris</button>
      <button id="btn-2">Londres</button>
      <button id="btn-3">Berlin</button>
      <button id="btn-4">Madrid</button>
      <p>La bonne réponse est Paris</p>
    </div>

    <div class="mousemove"></div>

    <nav>
      <ul>
        <li><a href="#accueil">Accueil</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <form action="" class="box">
      <input type="text" placeholder="Please enter your name" />
      <select>
        <option value="">Select your favorite language</option>
        <option value="Javascript">Javascript</option>
        <option value="Python">Python</option>
        <option value="PHP">PHP</option>
      </select>
      <input type="checkbox" id="CGV" />
      <label for="CGV">I accept the terms and conditions</label>
      <input type="submit" value="Valider" />
      <div></div>
    </form>
    <script src="index.js"></script>
  </body>
</html>
